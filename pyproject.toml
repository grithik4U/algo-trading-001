[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-001"
version = "0.1.0"
description = "Professional quantitative trading research framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
research = [
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "pytest>=8.0",
]
indicators = [
    "TA-Lib>=0.4.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
